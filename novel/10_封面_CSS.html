<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>账本城 · 封面（CSS 绘制版）</title>
<style>
  :root{ --ink:#3a4652; --paper:#f2ecdd; --paper2:#e6dcc4; --greyblue:#8fa3b5; --deep:#5d7183; }
  body{ margin:0; display:flex; justify-content:center; background:#e9e7e2; font-family:Georgia,"Songti SC","SimSun",serif; }
  .cover{ position:relative; width:600px; height:900px; margin:24px 0; overflow:hidden;
          background:linear-gradient(180deg,#dfe6ec 0%,#cfd9e2 30%,#b9c6d2 45%,var(--paper2) 46%,var(--paper) 100%);
          box-shadow:0 12px 40px rgba(0,0,0,.18); }
  /* 上三分之一留白 + 书名（由 HTML 文字叠加，图像不含文字） */
  .title{ position:absolute; top:120px; width:100%; text-align:center; color:var(--ink); letter-spacing:.35em; font-size:64px; }
  .subtitle{ position:absolute; top:220px; width:100%; text-align:center; color:#6b7a88; letter-spacing:.5em; font-size:16px; }
  /* 背景：三条街简化轮廓，浅到深 */
  .streets{ position:absolute; top:330px; width:100%; height:180px; opacity:.5; }
  /* 账册（下半部） */
  .ledger{ position:absolute; left:70px; right:70px; bottom:80px; height:360px; background:var(--paper);
           border:1px solid #d3c8ab; box-shadow:0 10px 24px rgba(58,70,82,.22); transform:perspective(900px) rotateX(4deg); }
  .ledger::before{ content:""; position:absolute; left:50%; top:0; bottom:0; width:2px; background:#d8ccb0; }
  .line{ position:absolute; left:8%; right:8%; height:2px; background:#c9bda0; opacity:.7; }
  /* 钟摆与斜长影子 */
  .pendulum{ position:absolute; left:50%; top:300px; width:3px; height:190px; background:var(--deep); transform-origin:top center; transform:rotate(24deg); }
  .bob{ position:absolute; left:50%; top:488px; width:34px; height:34px; margin-left:-17px; border-radius:50%;
        background:radial-gradient(circle at 35% 30%, #a9b8c6, var(--deep)); }
  .shadow{ position:absolute; left:190px; top:540px; width:300px; height:9px; background:linear-gradient(90deg,rgba(93,113,131,.45),rgba(93,113,131,0)); transform:rotate(9deg); }
  .note{ position:absolute; bottom:18px; width:100%; text-align:center; color:#8a94a0; font-size:12px; letter-spacing:.2em; }
</style>
</head>
<body>
  <div class="cover">
    <div class="streets">
      <svg viewBox="0 0 600 180" width="100%" height="100%" preserveAspectRatio="none">
        <g fill="none" stroke="#7f93a6" stroke-width="2" opacity=".8">
          <rect x="40"  y="90"  width="90" height="70"/><rect x="150" y="70"  width="60" height="90"/>
          <rect x="240" y="100" width="110" height="60"/><rect x="380" y="60"  width="50" height="100"/>
          <rect x="450" y="85"  width="100" height="75"/>
        </g>
        <g fill="#9db0c0" opacity=".35">
          <rect x="40" y="90" width="90" height="70"/><rect x="240" y="100" width="110" height="60"/>
        </g>
      </svg>
    </div>
    <div class="title">账本城</div>
    <div class="subtitle">每一次选择，都记进公共账册</div>
    <div class="pendulum"></div><div class="bob"></div><div class="shadow"></div>
    <div class="ledger">
      <div class="line" style="top:60px"></div><div class="line" style="top:120px"></div>
      <div class="line" style="top:180px"></div><div class="line" style="top:240px"></div>
    </div>
    <div class="note">纯 CSS/SVG 封面 · 构图：下半账册 + 斜长阴影 + 上方留白标题（图像生成未启用）</div>
  </div>
</body>
</html>
